body:"## Introducción\nEl hierro es indispensable para la síntesis de hemoglobina. La anemia ferropénica aparece cuando el aporte o las reservas de hierro no alcanzan para sostener la eritropoyesis, y es una de las causas más frecuentes de anemia en la práctica clínica.\n\n## Desarrollo\nLa interpretación combina el hemograma con el estudio del metabolismo del hierro. Tendencias esperables en una deficiencia establecida:\n\n| Parámetro | Tendencia habitual |\n|---|---|\n| Hemoglobina | Disminuida |\n| VCM / HCM | Disminuidos (microcitosis, hipocromía) |\n| RDW | Aumentado |\n| Ferritina sérica | Disminuida (refleja reservas) |\n| Hierro sérico | Disminuido |\n| Capacidad total de fijación (TIBC) | Aumentada |\n| Saturación de transferrina | Disminuida |\n\nLa ferritina es reactante de fase aguda: en inflamación puede estar normal o elevada aun con déficit, por lo que conviene interpretarla junto con la clínica y otros parámetros.\n\n## Conclusiones\nEl diagnóstico se apoya en la integración del hemograma y los indicadores del metabolismo del hierro, siempre en contexto clínico. [Texto ilustrativo: reemplazar por el contenido definitivo del autor.]",

function DNA(){const rm=true,T=0,D=0;
let defs=`<mask id="dm" maskUnits="userSpaceOnUse" x="0" y="0" width="290" height="370"><rect x="0" y="${rm?0:370}" width="290" height="${rm?370:0}" fill="#fff">${rm?"":`<animate attributeName="y" from="370" to="0" begin="${T}s" dur="${D}s" fill="freeze"/><animate attributeName="height" from="0" to="370" begin="${T}s" dur="${D}s" fill="freeze"/>`}</rect></mask>`,body="";
DNA_BARS.forEach(([x0,x1,y0,y1,t],i)=>{const p=t==="o"?1:0,x=x0-p,y=y0-p,w=x1-x0+2*p,h=y1-y0+2*p,m=x+w/2,dl=rm?0:(T+D*(370-(y0+y1)/2)/370+.05).toFixed(2),f=t==="o"?DNA_OR:DNA_GR,r=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h/2}" fill="${f}"/>`;
defs+=`<clipPath id="dl${i}"><rect x="${x-3}" y="${y-3}" width="${m-x+3}" height="${h+6}"/></clipPath><clipPath id="dr${i}"><rect x="${m}" y="${y-3}" width="${w/2+3}" height="${h+6}"/></clipPath>`;
body+=`<g class="bl" style="animation-delay:${dl}s"><g clip-path="url(#dl${i})">${r}</g></g><g class="br" style="animation-delay:${dl}s"><g clip-path="url(#dr${i})">${r}</g></g>`});
return`<span class="dnaw"><svg class="hl dna" viewBox="0 0 290 370" role="img" aria-label="Símbolo de Bioquns: hélice de ADN . Tocá para repetir la animación."><defs>${defs}</defs><image href="${DNA_RIB}" width="290" height="370" mask="url(#dm)"/>${body}</svg></span>`}
function route(){const p=location.hash.replace(/^#\/?/,"").split("/");let h;const k=p[0];
document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===k));$("#nav").classList.remove("open");
if(k==="articulos"&&p[1])h=detail("articles",p[1]);else if(k==="cursos"&&p[1])h=detail("courses",p[1]);else h=(V[k]||V[""])();
$("#app").innerHTML=h;window.scrollTo(0,0);if(k==="articulos"&&!p[1])filt();foot();reveal()}
function detail(t,sl){const i=D[t].find(x=>x.slug===sl&&(x.status==="published"||(adminOK&&A.preview)));if(!i)return`<div class="wrap"><h1>No encontrado</h1><p>El contenido que buscás no existe o no está publicado. <a href="#/">Volver al inicio</a></p></div>`;
if(t==="articles"){meta(i.title,i.summary);const r=lines(i.refs);return`<div class="wrap fade"><article class="art"><a href="#/articulos">← Artículos</a><p><span class="tag">${esc(i.cat)}</span>${exTag(i)}</p><h1>${esc(i.title)}</h1><div class="meta">${esc(i.authors)}${i.aff?" · "+esc(i.aff):""} · ${fd(i.date)}</div><div class="cover">${cover(i)}</div><div class="abs"><b class="ui">Resumen</b><br>${esc(i.summary)}</div><p class="meta"><b>Palabras clave:</b> ${esc(i.keywords)}</p>${md(i.body)}<h3>Referencias bibliográficas</h3>${r.length?"<ol>"+r.map(x=>`<li>${esc(x)}</li>`).join("")+"</ol>":"<p>[Pendiente: el autor debe completar las referencias reales.]</p>"}</article></div>`}
meta(i.title,i.desc);const ul=x=>lines(x).length?"<ul>"+lines(x).map(l=>`<li>${esc(l)}</li>`).join("")+"</ul>":"<p>A confirmar.</p>";
const cta=i.link?`<a class="btn" href="${esc(i.link)}" target="_blank" rel="noopener">Inscribirme</a>`:`<span class="tag warn">Información de inscripción próximamente</span>`;
return`<div class="wrap fade"><article class="art"><a href="#/cursos">← Cursos</a><p>${enTag(i)}${exTag(i)}</p><h1>${esc(i.title)}</h1><div class="cover">${cover(i)}</div><p>${esc(i.desc)}</p><div class="facts"><div><b>Modalidad</b>${esc(i.mode)}</div><div><b>Duración</b>${esc(i.duration||"A confirmar")}</div><div><b>Inicio</b>${fd(i.start)||"A confirmar"}</div><div><b>Finalización</b>${fd(i.end)||"A confirmar"}</div>${i.price?`<div><b>Precio</b>${esc(i.price)}</div>`:""}<div><b>Docentes</b>${esc(i.teachers||"A confirmar")}</div></div><h3>Objetivos</h3>${ul(i.objectives)}<h3>Temario</h3>${ul(i.syllabus)}<h3>Destinatarios y requisitos</h3>${md(i.audience||"A confirmar")}<div class="row">${i.enroll==="cerrada"?'<span class="tag off">Inscripciones cerradas</span>':cta}</div></article></div>`}
function filt(){const q=($("#q")?.value||"").toLowerCase(),c=$("#cat")?.value||"";const r=byDate(pub(D.articles)).filter(a=>(!c||a.cat===c)&&(!q||[a.title,a.authors,a.keywords,a.summary].join(" ").toLowerCase().includes(q)));$("#ag").innerHTML=r.map(aCard).join("")||"<p>No se encontraron artículos con esos criterios.</p>"}
function foot(){$("#admlink").hidden=!adminOK;const s=D.site,T=v=>String(v||"").trim(),it=(l,u)=>u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a>`:`<span class="fm">${esc(l)}</span>`,lk=(v,base)=>/^https?:\/\//i.test(v)?v:(base?base+v.replace(/^@/,""):"");
const ct=[T(s.email)?it(T(s.email),""):"",T(s.wa)?it(T(s.wa),"https://wa.me/"+T(s.wa).replace(/\D/g,"")):"",T(s.ig)?it(T(s.ig),lk(T(s.ig),"https://instagram.com/")):"",T(s.fb)?it(T(s.fb),lk(T(s.fb),"https://facebook.com/")):"",T(s.li)?it(T(s.li),lk(T(s.li),"")):""].filter(Boolean).join("");
$("#foot").innerHTML=`<div class="fbrand"><div class="fl"><img src="${LOGO_S}" alt=""><span>BIOQUNS</span></div><p>Docencia, educación a distancia y actualización profesional.</p></div><div><b>Navegación</b><a href="#/">Inicio</a><a href="#/articulos">Artículos científicos</a><a href="#/cursos">Cursos</a><a href="#/sobre-bioquns">Sobre Bioquns</a></div>${ct?`<div><b>Contacto y redes</b>${ct}</div>`:""}`;
$("#fb").innerHTML=`<span>© ${new Date().getFullYear()} BIOQUNS</span><span><a href="#/admin">Acceso editores</a>${adminOK?' · <a href="#" data-act="logout">Cerrar sesión</a>':""}</span>`}
/* ADMIN */
const FLD={articles:[["title","Título","text",1],["authors","Autor o autores","text",1],["aff","Afiliaciones","text"],["cat","Categoría","select",1,CATS],["date","Fecha","date",1],["img","Imagen de portada","file"],["motif","Ilustración si no hay imagen","select",0,MOT],["summary","Resumen","textarea",1,3],["keywords","Palabras clave (separadas por coma)","text"],["body","Texto completo (usá '## Título' para secciones, '- ' para listas, | para tablas)","textarea",1,14],["refs","Referencias bibliográficas (una por línea)","textarea",0,4]],
courses:[["title","Nombre del curso","text",1],["img","Imagen","file"],["motif","Ilustración si no hay imagen","select",0,MOT],["desc","Descripción","textarea",1,3],["teachers","Docentes","text"],["objectives","Objetivos (uno por línea)","textarea",0,4],["syllabus","Temario (un ítem por línea)","textarea",0,5],["audience","Destinatarios y requisitos","textarea",0,3],["mode","Modalidad","select",1,["Virtual","Presencial","Híbrida"]],["duration","Duración y carga horaria","text"],["start","Fecha de inicio","date"],["end","Fecha de finalización","date"],["price","Precio (opcional)","text"],["enroll","Estado de inscripción (marcá 'abierta' solo si está confirmada)","select",0,Object.keys(ENR)],["link","Enlace de inscripción (Google Forms, WhatsApp u otro)","text"]],
site:[["email","Correo electrónico de contacto","text"],["wa","WhatsApp (con código de país, solo números)","text"],["ig","Enlace de Instagram","text"],["fb","Enlace de Facebook","text"],["li","Enlace de LinkedIn","text"],["about","Texto de la página «Sobre Bioquns» (separá los párrafos con una línea en blanco)","textarea",0,10]]};
function fld(f,v){const[k,l,t,r,x]=f,id="f_"+k,lb=`<label for="${id}" class="${r?"req":""}">${l}</label>`;let c;
if(t==="select")c=`<select id="${id}">${x.map(o=>`<option value="${esc(o)}"${o===v?" selected":""}>${esc(ENR[o]||o)}</option>`).join("")}</select>`;
else if(t==="textarea")c=`<textarea id="${id}" rows="${x||3}">${esc(v)}</textarea>`;
else if(t==="file")c=`<input id="${id}" type="file" accept="image/*"><div id="pv">${v?`<img src="${esc(v)}" alt="" style="max-height:80px;margin-top:6px;border-radius:6px"> <button type="button" class="btn sm ghost" data-act="rmimg">Quitar</button>`:""}</div>`;
else c=`<input id="${id}" type="${t}" value="${esc(v)}">`;return`<div>${lb}${c}<div class="err" id="e_${k}"></div></div>`}
function adminView(){meta("Administrar","Panel de administración");
if(!adminOK)return`<div class="wrap"><h1>Acceso editores</h1><form class="f" id="lf" novalidate style="max-width:420px"><div><label class="req" for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password"><div class="err" id="pwe"></div></div><div><button class="btn" type="submit">Ingresar</button></div></form></div>`;
const t=A.tab,tabs=`<div class="tabs" role="tablist">${[["articles","Artículos"],["courses","Cursos"],["site","Sitio"]].map(([k,l])=>`<button class="btn ${t===k?"on":""}" data-act="tab" data-k="${k}">${l}</button>`).join("")}</div>`;
const note=dref?"":`<div class="note">Modo local: los cambios se guardan solo en este navegador. Con la web abierta e iniciada sesión como editor/a, se guardan en la nube y se comparten.</div>`;
if(t==="site"){const s={...D.site,news:(D.news||[]).join("\n")};return`<div class="wrap"><h1>Administrar</h1>${tabs}${note}<form class="f" id="sf" novalidate>${FLD.site.map(f=>fld(f,s[f[0]])).join("")}<div><button class="btn" type="submit">Guardar cambios</button></div></form></div>`}
if(A.edit){const e=A.edit;return`<div class="wrap"><h1>${e.id?"Editar":"Nuevo"} ${t==="articles"?"artículo":"curso"}</h1>${tabs}<form class="f" id="ef" novalidate style="max-width:760px">${FLD[t].map(f=>fld(f,e[f[0]]??"")).join("")}<div class="row"><button class="btn" type="button" data-act="save" data-s="published">Publicar</button><button class="btn ghost" type="button" data-act="save" data-s="draft">Guardar borrador</button><button class="btn ghost" type="button" data-act="cancel">Cancelar</button></div></form></div>`}
const L=D[t];return`<div class="wrap"><h1>Administrar</h1>${tabs}${note}<div class="row" style="margin:0 0 16px"><button class="btn" data-act="new">+ Nuevo ${t==="articles"?"artículo":"curso"}</button></div><div class="adm">${L.map(i=>`<div class="ar"><span class="tag ${i.status==="published"?"ok":"warn"}">${i.status==="published"?"Publicado":"Borrador"}</span><span class="t">${esc(i.title)}${exTag(i)}</span><a class="btn sm ghost" href="#/${t==="articles"?"articulos":"cursos"}/${i.slug}" ${i.status==="published"?"":'data-act="prev"'}>Ver</a><button class="btn sm ghost" data-act="edit" data-id="${i.id}">Editar</button><button class="btn sm ghost" data-act="tog" data-id="${i.id}">${i.status==="published"?"Pasar a borrador":"Publicar"}</button><button class="btn sm red" data-act="del" data-id="${i.id}">Eliminar</button></div>`).join("")||"<p>No hay elementos todavía.</p>"}</div></div>`}
const val=k=>document.getElementById("f_"+k)?.value.trim()??"";
function resize(file){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,800/im.width),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.75))};im.src=r.result};r.readAsDataURL(file)})}
document.addEventListener("change",async e=>{if(e.target.id==="f_img"&&e.target.files[0]){A.edit.img=await resize(e.target.files[0]);$("#pv").innerHTML=`<img src="${A.edit.img}" alt="" style="max-height:80px;margin-top:6px;border-radius:6px">`}});
document.addEventListener("input",e=>{if(e.target.id==="q")filt()});document.addEventListener("change",e=>{if(e.target.id==="cat")filt()});
document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target;
if(f.id==="lf"){const pw=$("#pw");if(await sha(pw.value)===PASS_HASH){adminOK=true;toast("Acceso concedido.");route()}else{await new Promise(r=>setTimeout(r,1200));pw.setAttribute("aria-invalid","true");$("#pwe").textContent="Contraseña incorrecta.";pw.value=""}return}
if(f.id==="cf"){let ok=1;[["n","Ingresá tu nombre."],["e","Ingresá un correo válido."],["m","Escribí tu mensaje."]].forEach(([i,m])=>{const el=document.getElementById(i),v=el.value.trim(),bad=!v||(i==="e"&&!/^\S+@\S+\.\S+$/.test(v));el.setAttribute("aria-invalid",bad);el.nextElementSibling.textContent=bad?m:"";if(bad)ok=0});
if(!ok)return;if(!D.site.email){toast("Falta configurar el correo de contacto (Administrar → Sitio).");return}
location.href=`mailto:${D.site.email}?subject=${encodeURIComponent("Consulta desde la web de Bioquns")}&body=${encodeURIComponent($("#m").value+"\n\n"+$("#n").value+" <"+$("#e").value+">")}`;toast("Se abrió tu cliente de correo para enviar el mensaje.")}
if(f.id==="sf"){FLD.site.forEach(([k])=>{if(k==="news")D.news=lines(val(k));else D.site[k]=val(k)});if(await persist())toast("Sitio actualizado.");foot()}});
document.addEventListener("click",async e=>{const b=e.target.closest("[data-act]");if(!b){const dn=e.target.closest(".dnaw");if(dn){dn.outerHTML=DNA();return}if(e.target.closest("#menu")){const o=$("#nav").classList.toggle("open");$("#menu").setAttribute("aria-expanded",o)}return}
const a=b.dataset.act,t=A.tab,L=D[t],it=L&&L.find(x=>x.id===b.dataset.id),R=()=>{$("#app").innerHTML=adminView()};
if(a==="logout"){e.preventDefault();adminOK=false;location.hash="#/";route();return}else if(a==="tab"){A.tab=b.dataset.k;A.edit=null;R()}
else if(a==="new"){A.edit=t==="articles"?{cat:CATS[0],date:new Date().toISOString().slice(0,10),motif:MOT[0]}:{mode:"Virtual",enroll:"proxima",motif:MOT[3]};R()}
else if(a==="edit"){A.edit={...it};R()}else if(a==="cancel"){A.edit=null;R()}
else if(a==="rmimg"){A.edit.img="";$("#pv").innerHTML=""}
else if(a==="prev"){A.preview=1}
else if(a==="tog"){it.status=it.status==="published"?"draft":"published";await persist();R()}
else if(a==="del"){if(confirm("¿Eliminar definitivamente?")){D[t]=L.filter(x=>x!==it);await persist();R();toast("Eliminado.")}}
else if(a==="save"){let ok=1;const n={...A.edit};FLD[t].forEach(f=>{if(f[2]==="file")return;n[f[0]]=val(f[0]);const bad=f[3]&&!n[f[0]],el=document.getElementById("f_"+f[0]);el.setAttribute("aria-invalid",!!bad);document.getElementById("e_"+f[0]).textContent=bad?"Campo obligatorio.":"";if(bad)ok=0});
if(!ok){toast("Completá los campos obligatorios.");return}
if(t==="courses"&&n.link&&!/^(https?:\/\/|mailto:)/i.test(n.link)){toast("El enlace debe empezar con https://");return}
n.status=b.dataset.s;delete n.example;if(!n.id){n.id="i"+Date.now();let s=slug(n.title),x=s,c=2;while(L.some(y=>y.slug===x))x=s+"-"+c++;n.slug=x;L.unshift(n)}else L[L.findIndex(y=>y.id===n.id)]=n;
if(await persist()){A.edit=null;R();toast(n.status==="published"?"Publicado.":"Borrador guardado.")}}});
$("#menu").addEventListener("click",()=>{});
window.addEventListener("hashchange",route);route();
/* nube opcional: si hay sesión de editor, se comparte el contenido */
(async()=>{try{const c=window.claude&&await claude.use("db"),u=window.claude&&await claude.use("user");if(!c)return;dref=c.doc("site/content");
const s=await dref.get();if(s.exists){D=JSON.parse(s.data().json)}else if(adminOK){await dref.set({json:JSON.stringify(D)})}
$("#admlink").hidden=!adminOK;route()}catch(e){dref=null}})();
</script>
